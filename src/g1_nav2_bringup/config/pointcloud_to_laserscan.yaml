pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    # base_link is coincident with the virtual upright lidar/body origin.
    # Keep the same physical slice used to generate the PGM map.
    min_height: -1.10
    max_height: 0.30
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665
    scan_time: 0.10
    range_min: 0.35
    range_max: 12.0
    use_inf: true
    inf_epsilon: 1.0
